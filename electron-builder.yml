appId: com.clipforge.app
productName: ClipForge
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # Ship the icon inside the app so the runtime BrowserWindow/taskbar icon
  # resolves in the packaged build (not only the installer).
  - build/icon.ico
  - build/icon.png

# FFmpeg/FFprobe binaries must stay on disk (not inside the asar) so they can be
# spawned as child processes. ffmpegLocator rewrites app.asar -> app.asar.unpacked.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # This machine cannot extract electron-builder's winCodeSign package (its
  # symlinks require Developer Mode/admin), which electron-builder needs for the
  # combined sign+rcedit step. We therefore disable that step here and embed the
  # app icon into the exe with rcedit directly (see scripts/apply-win-icon.mjs).
  # On a normal/CI machine, remove this line and electron-builder embeds the
  # icon itself from win.icon above.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: build/icon.png
  category: public.app-category.video
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # FFmpeg is licensed under LGPL/GPL; the hardened runtime needs these
  # entitlements for spawning the unpacked binaries.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  icon: build/icon.png
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish: null
